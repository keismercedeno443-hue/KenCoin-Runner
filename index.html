<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mi Escena 3D - Césped</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #12161f;
      font-family: system-ui, -apple-system, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #status-overlay {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 10;
      background: rgba(15, 20, 30, 0.75);
      color: #f1f5f9;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    #status-overlay.error {
      background: rgba(127, 29, 29, 0.88);
      border-color: rgba(248, 113, 113, 0.45);
      color: #fecaca;
    }

    #status-overlay.hidden {
      opacity: 0;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="status-overlay">Cargando modelo 3D...</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // CONFIGURACIÓN DEL MODELO
    const MODEL_PATH = './cesped.glb'; // Cambia esto al nombre exacto de tu archivo .glb
    const MODEL_SCALE = { x: 1, y: 1, z: 1 };
    const MODEL_POSITION = { x: 0, y: 0, z: 0 };

    const container = document.getElementById('canvas-container');
    const statusEl = document.getElementById('status-overlay');

    function setStatus(message, isError = false, autoHideMs = 0) {
      statusEl.textContent = message;
      statusEl.classList.toggle('error', isError);
      statusEl.classList.remove('hidden');

      if (autoHideMs > 0 && !isError) {
        setTimeout(() => {
          statusEl.classList.add('hidden');
        }, autoHideMs);
      }
    }

    // ESCENA
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

    // CÁMARA
    const camera = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.set(0, 4, 8);

    // RENDERER
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // CONTROLES TÁCTILES / RATÓN
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxPolarAngle = Math.PI * 0.49; // Evita meter la cámara bajo el suelo
    controls.minDistance = 1;
    controls.maxDistance = 60;

    // LUCES
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x3b5229, 1.1);
    hemiLight.position.set(0, 20, 0);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xfff8e7, 1.8);
    dirLight.position.set(8, 15, 10);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    scene.add(dirLight);

    // CARGA DEL ARCHIVO .GLB
    const loader = new GLTFLoader();
    let loadedModel = null;

    loader.load(
      MODEL_PATH,
      (gltf) => {
        loadedModel = gltf.scene;
        loadedModel.scale.set(MODEL_SCALE.x, MODEL_SCALE.y, MODEL_SCALE.z);
        loadedModel.position.set(MODEL_POSITION.x, MODEL_POSITION.y, MODEL_POSITION.z);

        loadedModel.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });

        scene.add(loadedModel);

        // Centra la cámara automáticamente respecto al tamaño del modelo
        const box = new THREE.Box3().setFromObject(loadedModel);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z) || 4;

        controls.target.copy(center);
        camera.position.set(
          center.x,
          center.y + maxDim * 0.6,
          center.z + maxDim * 1.3
        );
        controls.update();

        setStatus('Modelo listo', false, 1500);
      },
      (xhr) => {
        if (xhr.total > 0) {
          const pct = Math.min(100, Math.round((xhr.loaded / xhr.total) * 100));
          setStatus(`Cargando modelo: ${pct}%`);
        } else {
          setStatus('Cargando modelo 3D...');
        }
      },
      (err) => {
        console.error('Error al cargar el .glb:', err);
        setStatus(`No se pudo cargar "${MODEL_PATH}". Revisa el nombre y la ruta.`, true);
      }
    );

    // REDIMENSIONAR PANTALLA
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    // LOOP PRINCIPAL
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
